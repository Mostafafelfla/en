name: Download and Extract Zip to Repo

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  extract-zip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install gdown
        run: pip install gdown

      - name: Download and Extract from Google Drive
        run: |
          # 1. تحميل الملف المضغوط
          gdown 1W6JWZzlm6CzH2hnNdB9NcKvptLjv1t_P -O site.zip
          
          # 2. فك الضغط في مجلد مؤقت
          mkdir -p extracted
          unzip -q site.zip -d extracted
          
          # 3. تنظيف المستودع الحالي مع الحفاظ على ملفات النظام و .github
          find . -maxdepth 1 ! -name '.' ! -name '..' ! -name '.git' ! -name '.github' ! -name 'README.md' -exec rm -rf {} +

          # 4. نقل الملفات بذكاء: لو فيه مجلد رئيسي واحد جوه الـ zip انقل محتواه، لو ملفات منفضة نقلها مباشرة
          CONTENTS=(extracted/*)
          if [ ${#CONTENTS[@]} -eq 1 ] && [ -d "${CONTENTS[0]}" ]; then
            cp -r "${CONTENTS[0]}"/* ./
          else
            cp -r extracted/* ./
          fi
          
          # 5. تنظيف الملفات المؤقتة
          rm -rf site.zip extracted

      - name: Commit and Push Extracted Files
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Auto-extract zip file from Google Drive [skip ci]" || exit 0
          git push
