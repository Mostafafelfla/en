name: Build and Push Processed Files

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install beautifulsoup4 gdown

      - name: Download & Extract from Google Drive
        run: |
          gdown 1RafxMgCb0sWSZwpyM-Wj-xIZY3Aci4tm -O site.zip
          unzip -q site.zip -d extracted
          ROOT_DIR=$(dirname $(find extracted -name "choose-exam.html" | head -n 1))
          mkdir -p public
          mv "$ROOT_DIR"/* public/

      - name: Run Build Script (Python Fixes)
        run: python build.py

      - name: Move processed files to root for repository storage
        run: |
          # حذف الملفات القديمة من المستودع ما عدا ملفات الـ workflows وبايثون
          find . -maxdepth 1 ! -name '.' ! -name '.git' ! -name '.github' ! -name 'build.py' ! -name 'README.md' -exec rm -rf {} +
          
          # نقل الملفات المعالجة من public إلى الجذر الرئيسي للمستودع
          cp -r public/* ./
          rm -rf public

      - name: Commit and Push Processed Files to Main
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Auto-processed and fixed exam files [skip ci]" || exit 0
          git push
