name: Deploy CELPIP Offline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install beautifulsoup4 gdown

      - name: Download & Extract from Google Drive
        run: |
          # تحميل الملف المضغوط باستخدام الـ ID الخاص بيك (بدون كلمة --id)
          gdown 1RafxMgCb0sWSZwpyM-Wj-xIZY3Aci4tm -O site.zip
          
          # فك الضغط في مجلد مؤقت
          unzip -q site.zip -d extracted
          
          # البحث عن المجلد الأساسي ونقل الملفات إلى public
          ROOT_DIR=$(dirname $(find extracted -name "choose-exam.html" | head -n 1))
          mkdir -p public
          mv "$ROOT_DIR"/* public/

      - name: Run Build Script (Python Fixes)
        run: python build.py

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
