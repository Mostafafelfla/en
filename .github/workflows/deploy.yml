name: Download and Extract to Repo

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  download-and-extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install gdown
        run: pip install gdown

      - name: Download & Extract from Google Drive
        run: |
          # تحميل الملف المضغوط
          gdown 1RafxMgCb0sWSZwpyM-Wj-xIZY3Aci4tm -O site.zip
          
          # فك الضغط في مجلد مؤقت
          unzip -q site.zip -d extracted
          
          # العثور على المجلد الذي يحتوي علىchoose-exam.html بداخله
          ROOT_DIR=$(dirname $(find extracted -name "choose-exam.html" | head -n 1))
          
          # حذف الملفات القديمة في المستودع (مع الحفاظ على .git و .github)
          find . -maxdepth 1 ! -name '.' ! -name '..' ! -name '.git' ! -name '.github' ! -name 'README.md' -exec rm -rf {} +
          
          # نقل كل ملفات الموقع المفكوكة إلى الجذر الرئيسي مباشرة
          mv "$ROOT_DIR"/* ./
          
          # تنظيف الملفات المؤقتة
          rm -rf site.zip extracted

      - name: Commit and Push to Main
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Auto-extracted site files from Google Drive [skip ci]" || exit 0
          git push
