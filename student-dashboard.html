<script>
    var listeningData = [
      
          {'clb': 'M', 'date': 'Aug. 6, 2026, 12:04 a.m.', 'index': '68', 'url': '/student/listening/listening-answers/810', 'result': 4 },
      
          {'clb': '3', 'date': 'Aug. 5, 2026, 4:23 p.m.', 'index': '20', 'url': '/student/listening/listening-answers/141', 'result': 8 },
      
          {'clb': '3', 'date': 'Aug. 5, 2026, 3:31 p.m.', 'index': '14', 'url': '/student/listening/listening-answers/86', 'result': 8 },
      
          {'clb': '3', 'date': 'Aug. 5, 2026, 1:28 p.m.', 'index': '10', 'url': '/student/listening/listening-answers/361', 'result': 8 },
      
          {'clb': '3', 'date': 'Aug. 4, 2026, 9:47 p.m.', 'index': '8', 'url': '/student/listening/listening-answers/217', 'result': 8 }
      
    ];
    var readingData = [
      
          {'clb': 'M', 'date': 'Aug. 6, 2026, 12:04 a.m.', 'index': '69', 'url': '/student/reading/reading-answers/810', 'result': 5 },
      
          {'clb': 'M', 'date': 'Aug. 6, 2026, 12:04 a.m.', 'index': '68', 'url': '/student/reading/reading-answers/810', 'result': 5 },
      
          {'clb': 'M', 'date': 'Aug. 5, 2026, 4:23 p.m.', 'index': '21', 'url': '/student/reading/reading-answers/141', 'result': 5 },
      
          {'clb': 'M', 'date': 'Aug. 5, 2026, 4:23 p.m.', 'index': '20', 'url': '/student/reading/reading-answers/141', 'result': 5 },
      
          {'clb': 'M', 'date': 'Aug. 5, 2026, 3:34 p.m.', 'index': '15', 'url': '/student/reading/reading-answers/86', 'result': 5 },
      
          {'clb': 'M', 'date': 'Aug. 5, 2026, 3:31 p.m.', 'index': '14', 'url': '/student/reading/reading-answers/86', 'result': 5 },
      
          {'clb': 'M', 'date': 'Aug. 5, 2026, 1:28 p.m.', 'index': '11', 'url': '/student/reading/reading-answers/361', 'result': 5 },
      
          {'clb': 'M', 'date': 'Aug. 5, 2026, 1:28 p.m.', 'index': '10', 'url': '/student/reading/reading-answers/361', 'result': 5 },
      
          {'clb': 'M', 'date': 'Aug. 4, 2026, 9:48 p.m.', 'index': '9', 'url': '/student/reading/reading-answers/217', 'result': 6 },
      
          {'clb': 'M', 'date': 'Aug. 4, 2026, 9:47 p.m.', 'index': '8', 'url': '/student/reading/reading-answers/217', 'result': 6 }
      
    ];

    console.log(readingData)

    // Example of using dataPoints in a chart
    document.addEventListener("DOMContentLoaded", (event) => {
      var canvas = document.querySelector("canvas");
      fitToContainer(canvas);

      function fitToContainer(canvas) {
        // Make it visually fill the positioned parent
        canvas.style.width = "100%";
        canvas.style.height = "100%";
        // ...then set the internal size to match
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;
      }


      const ctx = document.getElementById("myChart").getContext("2d");
      const chart = new Chart(ctx, {
        // The type of chart we want to create
        type: "line",
        // The data for our dataset
        data: {
          datasets: [
            {
              label: "Listening",
              backgroundColor: "rgba(57, 62, 70, 0.2)",
              borderColor: "rgba(57, 62, 70, 1)",
              data: listeningData.map(item => ({ x: item.index, y: item.result, date: item.date, url: item.url, clb: item.clb })),
              parsing: {
                xAxisKey: "x",
                yAxisKey: "y",
              },
              pointRadius: 5,
              hitRadius: 10,
              hoverRadius: 7,
              borderWidth: 2,
              fill: false,
              tension: 0.4 // Increase this value for smoother curves
            },
            {
              label: "Reading",
              backgroundColor: "rgba(199, 35, 35, 0.2)",
              borderColor: "rgba(199, 35, 35, 1)",
              data: readingData.map(item => ({ x: item.index, y: item.result, date: item.date, url: item.url, clb: item.clb })),
              parsing: {
                xAxisKey: "x",
                yAxisKey: "y",
              },
              pointRadius: 5,
              hitRadius: 10,
              hoverRadius: 7,
              borderWidth: 2,
              fill: false,
              tension: 0.4 // Increase this value for smoother curves
            },
          ],
        },
         // Configuration options go here
        options: {
          onClick: function(evt, elements) {
            if (elements.length > 0) {
              const datasetIndex = elements[0].datasetIndex;
              const index = elements[0].index;
              const url = chart.data.datasets[datasetIndex].data[index].url;
              console.log(url)
              if (url) {
                  window.location.href = url;
              }
            }
          },
          title: {
              display: true,
              text: 'Score Tracker',
              font: {
                  size: 18,
                  weight: 'bold'
              },
              color: 'rgba(57, 62, 70, 1)'
          },
          scales: {
            x: {
              type: 'linear', // Use linear for evenly spaced data
              position: 'bottom',
              display: false,
              title: {
                  display: false,
                  text: 'Index'
              },
            },
            y: {
                title: {
                    display: true,
                    text: 'Result'
                }
            }
          },
          plugins: {
            tooltip: {
              callbacks: {
                title: function() {
                  return ''; // Hides the title which is the index by default
                },
                label: function(tooltipItem) {
                  const date = tooltipItem.raw.date;
                  const result = tooltipItem.raw.y;
                  const clb = tooltipItem.raw.clb;
                  return `Date: ${date}, Result: ${result}, CLB: ${clb}`;
                }
              }
            }
          }
        }
      });
    });
  </script>
